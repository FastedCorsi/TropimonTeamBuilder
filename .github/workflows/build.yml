name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Test and build
        run: ./gradlew --no-daemon clean test build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TropimonTeamBuilder
          path: build/libs/TropimonTeamBuilder-*.jar
          if-no-files-found: error
